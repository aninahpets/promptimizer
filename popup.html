<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promptimizer</title>
<style>
  /* Promptimizer popup — the guided flow, reflowed for a ~400px toolbar popup.
     Color: sunny cream + warm terracotta; earthy olive/gold/brick for semantics.
     Type: Young Serif (display), Hanken Grotesk (body), Spline Sans Mono (prompt + readouts). */
  :root {
    --bg: #fcf5ea; --surface: #fffdf8; --surface-2: #f6ecda;
    --ink: #3a3026; --muted: #7c7061; --faint: #b1a38d;
    --line: #efe3cf; --line-strong: #e2d2b8;
    --accent: #c96f4c; --accent-ink: #ad5634; --accent-weak: #f9e8dc; --on-accent: #fffaf4;
    --good: #6b8e4e; --warn: #c6881f; --crit: #b23a32;
    --shadow: 0 1px 2px rgba(120,80,40,.05), 0 8px 22px rgba(150,100,50,.08);
    --r: 15px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #221a12; --surface: #2c2318; --surface-2: #362b1e;
      --ink: #f1e7d8; --muted: #b6a991; --faint: #7f7360;
      --line: #3b3022; --line-strong: #4d4030;
      --accent: #e5906b; --accent-ink: #efab89; --accent-weak: #3a2619; --on-accent: #2c160b;
      --good: #88ad65; --warn: #d8a846; --crit: #e2795b;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.45); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #221a12; --surface: #2c2318; --surface-2: #362b1e;
    --ink: #f1e7d8; --muted: #b6a991; --faint: #7f7360;
    --line: #3b3022; --line-strong: #4d4030;
    --accent: #e5906b; --accent-ink: #efab89; --accent-weak: #3a2619; --on-accent: #2c160b;
    --good: #88ad65; --warn: #d8a846; --crit: #e2795b;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.45); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { width: 400px; }
  body {
    width: 400px; background: var(--bg); color: var(--ink);
    font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }

  .wrap { padding: 0 14px 20px; }

  /* Header + progress rail */
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    margin: 0 -14px; padding: 12px 14px 11px;
  }
  .headrow { display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
  .mark { width: 26px; height: 26px; flex: none; display: block; }
  .brand h1 { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 18px; letter-spacing: -.005em; margin: 0; }
  .rail { display: flex; gap: 6px; margin-top: 11px; }
  .rail .step { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .rail .bar { height: 4px; border-radius: 4px; background: var(--line-strong); transition: background .35s; }
  .rail .step.done .bar, .rail .step.active .bar { background: var(--accent); }
  .rail .lbl { font-size: 10px; letter-spacing: .01em; color: var(--faint); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail .step.active .lbl, .rail .step.done .lbl { color: var(--muted); }

  main { margin-top: 18px; }
  h2.title { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 23px; line-height: 1.12; letter-spacing: -.01em; text-wrap: balance; margin: 0 0 8px; }
  .lede { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .eyebrow { font-size: 11.5px; letter-spacing: .02em; color: var(--accent-ink); font-weight: 600; margin: 0 0 8px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
  .card + .card { margin-top: 12px; }

  textarea#ask {
    width: 100%; min-height: 108px; resize: vertical;
    border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface);
    color: var(--ink); padding: 12px 13px; font: inherit; line-height: 1.5;
  }
  textarea#ask::placeholder { color: var(--faint); }
  textarea#ask:focus, input:focus, select:focus { outline: 2.5px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .field { margin-top: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .field label .hint { color: var(--faint); font-weight: 400; }
  .field select, .field input {
    width: 100%; border: 1.5px solid var(--line-strong); border-radius: 10px;
    background: var(--surface); color: var(--ink); padding: 10px 11px; font: inherit;
  }
  .examples { margin-top: 15px; }
  .examples .ex-h { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { border: 1.5px solid var(--line-strong); background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: .15s; text-align: left; }
  .chip:hover { border-color: var(--accent); color: var(--ink); background: var(--accent-weak); }

  .actions { display: flex; gap: 9px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button.btn { font: inherit; font-weight: 600; cursor: pointer; border-radius: 11px; padding: 10px 16px; border: 1.5px solid transparent; transition: .15s; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; }
  .btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 3px 11px color-mix(in srgb, var(--accent) 28%, transparent); }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--line-strong); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--accent); }
  .btn.subtle { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
  .btn.subtle:hover { border-color: var(--accent); }
  .hintline { color: var(--faint); font-size: 12px; }

  .restate { border-left: 4px solid var(--accent); background: var(--accent-weak); padding: 12px 14px; border-radius: 0 12px 12px 0; margin-bottom: 4px; }
  .restate .k { font-size: 12px; color: var(--accent-ink); font-weight: 600; }
  .restate p { margin: 4px 0 0; font-size: 14.5px; }
  .archetype { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 11px; margin-bottom: 12px; background: var(--surface); }
  .archetype b { color: var(--ink); font-weight: 600; text-transform: capitalize; }
  .assumptions { margin: 6px 0 0; padding: 0; list-style: none; }
  .assumptions li { color: var(--muted); font-size: 13.5px; padding: 3px 0 3px 18px; position: relative; }
  .assumptions li::before { content: ""; position: absolute; left: 3px; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .5; }

  .q { padding: 15px 0; border-top: 1px solid var(--line); }
  .q:first-child { border-top: none; padding-top: 3px; }
  .q .qhead { display: flex; gap: 9px; align-items: baseline; }
  .q .qn { font-family: "Spline Sans Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--accent-ink); font-weight: 500; flex: none; }
  .q .qtext { font-weight: 600; font-size: 14.5px; }
  .q .why { color: var(--muted); font-size: 12.5px; margin: 4px 0 9px 22px; }
  .opts { display: flex; flex-wrap: wrap; gap: 7px; margin-left: 22px; }
  .opt { border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--muted); border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer; transition: .12s; }
  .opt:hover { border-color: var(--accent); color: var(--ink); }
  .opt.sel { border-color: var(--accent); background: var(--accent-weak); color: var(--accent-ink); font-weight: 600; }
  .opt .df { font-size: 10px; opacity: .7; margin-left: 5px; }
  .freeform { margin: 9px 0 0 22px; }
  .freeform input { width: 100%; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 10px 12px; font: inherit; }

  .levers { margin-top: 2px; }
  .lever { padding: 14px 0; border-top: 1px solid var(--line); }
  .lever:first-child { border-top: none; padding-top: 2px; }
  .lever .ltop { display: flex; justify-content: space-between; align-items: baseline; gap: 9px; }
  .lever .lname { font-weight: 600; font-size: 14.5px; }
  .lever .lval { font-family: "Spline Sans Mono", ui-monospace, monospace; font-size: 12.5px; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .lever .lends { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 8px; font-weight: 500; }
  .lever .ldesc { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin-top: 8px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 6px; background: var(--line-strong); margin: 10px 0 0; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 4px solid var(--surface); box-shadow: 0 0 0 1.5px var(--accent), 0 2px 5px rgba(0,0,0,.15); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; border: 4px solid var(--surface); background: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }

  .promptbox { position: relative; }
  pre.prompt { font-family: "Spline Sans Mono", ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin: 0; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 15px 48px 15px 15px; max-height: 300px; overflow: auto; }
  .copybtn { position: absolute; top: 9px; right: 9px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 8px; border: 1.5px solid var(--line-strong); background: color-mix(in srgb, var(--surface) 82%, transparent); color: var(--muted); cursor: pointer; transition: .15s; backdrop-filter: blur(4px); z-index: 2; }
  .copybtn:hover { color: var(--ink); border-color: var(--accent); background: var(--surface); }
  .copybtn:active { transform: scale(.94); }
  .copybtn.ok { color: var(--good); border-color: var(--good); }
  .copybtn svg { display: block; }
  .meter { display: flex; gap: 8px 16px; flex-wrap: wrap; margin: 13px 0 0; font-size: 12px; color: var(--muted); }
  .meter b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .section-h { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 11px; }
  .rat { padding: 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 11px; }
  .rat:first-of-type { border-top: none; }
  .rtag { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px; height: fit-content; white-space: nowrap; background: var(--accent-weak); color: var(--accent-ink); border: 1px solid transparent; }
  .rat .rs { font-weight: 600; font-size: 13.5px; }
  .rat .rw { color: var(--muted); font-size: 13px; }
  .leftopen { margin: 2px 0 0; padding: 0; list-style: none; }
  .leftopen li { color: var(--muted); font-size: 13px; padding: 4px 0 4px 20px; position: relative; }
  .leftopen li::before { content: "○"; position: absolute; left: 3px; color: var(--accent); font-size: 11px; top: 5px; }

  .reco { border-color: color-mix(in srgb, var(--accent) 32%, var(--line)); background: color-mix(in srgb, var(--accent-weak) 45%, var(--surface)); }
  .reco-row { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 11px 0; border-top: 1px solid var(--line); }
  .reco-row:first-of-type { border-top: none; padding-top: 2px; }
  .reco-k { font-size: 12px; color: var(--muted); font-weight: 600; }
  .reco-v { font-weight: 700; color: var(--accent-ink); font-size: 15px; word-break: break-word; }
  .reco-w { color: var(--muted); font-size: 12.5px; }

  .risk { padding: 12px 0; border-top: 1px solid var(--line); }
  .risk:first-child { border-top: none; }
  .risk .rhead { display: flex; align-items: center; gap: 9px; }
  .sev { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .sev.high { background: color-mix(in srgb, var(--crit) 16%, transparent); color: var(--crit); }
  .sev.med { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .sev.low { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .risk .issue { font-weight: 600; font-size: 13.5px; }
  .risk .fix { color: var(--muted); font-size: 13px; margin: 5px 0 0 2px; }
  .risk .fix b { color: var(--accent-ink); font-weight: 600; }
  .score { display: flex; align-items: baseline; gap: 9px; margin-bottom: 6px; }
  .score .num { font-family: "Young Serif", Georgia, serif; font-size: 32px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .score .den { color: var(--faint); font-size: 13px; }

  .loader { text-align: center; padding: 34px 0; }
  .dial { width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader .lm { color: var(--muted); font-size: 14px; min-height: 1.4em; }
  @media (prefers-reduced-motion: reduce) { .dial { animation: none; } }

  .notice { background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); border-radius: 11px; padding: 12px 14px; color: var(--ink); font-size: 13.5px; }
  .notice b { color: var(--ink); }
  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 17px; border-radius: 999px; font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .foot { margin-top: 18px; color: var(--faint); font-size: 12px; text-align: center; }
  .foot b { color: var(--muted); font-weight: 600; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&family=Young+Serif&display=swap">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="headrow">
        <div class="brand">
          <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="pzg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c96f4c"/><stop offset="1" stop-color="#ad5634"/></linearGradient></defs><rect x="6" y="6" width="88" height="88" rx="25" fill="url(#pzg)"/><path d="M50 16 Q62 38 84 50 Q62 62 50 84 Q38 62 16 50 Q38 38 50 16 Z" fill="#fffdf8"/><circle cx="41" cy="45" r="5" fill="#ad5634"/><circle cx="59" cy="45" r="5" fill="#ad5634"/><path d="M42 55 Q50 63 58 55" fill="none" stroke="#ad5634" stroke-width="4.6" stroke-linecap="round"/></svg>
          <h1>Promptimizer</h1>
        </div>
      </div>
      <div class="rail" id="rail"></div>
    </header>
    <main id="app"></main>
    <div class="foot">Most AI tools rush to answer. This one asks a few good questions first, then writes the prompt for you.</div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
